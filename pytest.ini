[pytest]
DJANGO_SETTINGS_MODULE = curamind.settings
python_files = tests/test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --cov=apps --cov-report=term-missing --cov-fail-under=80

[coverage:run]
source = apps
omit =
    */migrations/*
    */tests/*
    */__init__.py
    */apps.py
    */admin.py

[coverage:report]
show_missing = True
skip_covered = False
