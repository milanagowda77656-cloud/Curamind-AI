worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Security headers (HIPAA hardening)
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    # Hide nginx version
    server_tokens off;

    # Request size limits (for medical image uploads)
    client_max_body_size 55M;

    sendfile on;
    keepalive_timeout 65;

    upstream curamind_app {
        server web:8000;
    }

    server {
        listen 80;
        server_name _;

        # Redirect all HTTP → HTTPS in production
        # return 301 https://$host$request_uri;

        location /static/ {
            alias /app/staticfiles/;
            expires 1y;
            access_log off;
        }

        location /media/ {
            # In production: serve from S3, not local disk
            alias /app/media/;
            internal;  # Only accessible via X-Accel-Redirect
        }

        location / {
            proxy_pass http://curamind_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120;
            proxy_connect_timeout 10;
        }

        # Block common attack paths
        location ~ /\. {
            deny all;
        }
    }
}
